[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lono-gateway"
version = "0.1.0"
description = "Lono: local AI security and audit gateway (sanitize, pseudonymize, audit) in front of LiteLLM"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
minio = ["minio>=7.2"]
pii-local = ["presidio-analyzer>=2.2.35"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lono_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]