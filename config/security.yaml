# Lono security configuration.
# Values support environment expansion: ${VAR} or ${VAR:-default}.

mode: sanitize # observe | sanitize | enforce
fail_closed: false
allow_client_mode_override: false # allow X-Lono-Mode header to override mode per request
inspect_tools: true # scan tool descriptions (flag-only)

detectors:
  secrets:
    enabled: true
    action: mask # mask | flag | block
    entropy: true
    entropy_threshold: 4.2
    entropy_min_length: 24
    entropy_action: flag # high-entropy strings are noisy; flag by default

  pii:
    enabled: true
    engine: auto # auto | presidio | regex
    presidio_url: ${PRESIDIO_URL:-http://presidio-analyzer:3000}
    language: en
    score_threshold: 0.4
    timeout_s: 10
    default_action: pseudonymize # used for entity types not listed below
    custom_patterns_file: ${LONO_CONFIG_DIR:-/config}/presidio/patterns.yaml
    filter_technical: true # drop Presidio name entities that look like code identifiers/paths
    actions:
      EMAIL_ADDRESS: pseudonymize
      PERSON: pseudonymize
      PHONE_NUMBER: pseudonymize
      LOCATION: pseudonymize
      ORGANIZATION: pseudonymize
      IP_ADDRESS: pseudonymize
      STREET_ADDRESS: pseudonymize
      POSTAL_CODE: pseudonymize
      CREDIT_CARD: mask
      US_SSN: mask
      US_PASSPORT: mask
      US_DRIVER_LICENSE: mask
      MEDICAL_LICENSE: mask
      IBAN_CODE: mask
      BTC_ADDRESS: mask
      ETH_ADDRESS: mask
      MAC_ADDRESS: flag
      DATE_TIME: flag
      URL: flag

  injection:
    enabled: true
    action: flag # flag | block (block applies in enforce mode only)
    flag_threshold: 0.45
    block_threshold: 0.8

  urls:
    enabled: true
    action: flag # flag | block (block applies in enforce mode only)
    allow_schemes: [http, https]
    block_threshold: 0.9

# Watchlist of project codenames, internal terms, and other sensitive strings.
# Terms come from this inline list and/or watchlist.file.
watchlist:
  enabled: true
  file: ${LONO_CONFIG_DIR:-/config}/watchlist.yaml
  terms: []
  # - term: "Project Bluebird"
  #   category: PROJECT_CODENAME
  #   replacement_type: PROJECT_CODENAME   # which generator to use for the fake value
  #   action: pseudonymize                 # pseudonymize | mask | flag | block
  #   match: word                          # word | substring | regex
  #   case_sensitive: false
  # - term: "acme-internal"
  #   category: INTERNAL_NAME
  #   action: mask

output_scan:
  enabled: true
  secrets: true
  injection: true
  pii: true
  watchlist: true
  action: flag # flag | mask (secrets only when mask)

pseudonymization:
  secret: ${LONO_PSEUDONYM_SECRET:-}
  stable_across_sessions: false # true = same entity maps to the same pseudonym everywhere
  # Per-category replacement lists. Relative paths resolve against lists_dir;
  # use "builtin" to force the shipped Python defaults. Inline pools win.
  #
  # The entries below are the categories that are list-backed by default.
  # You may add ANY other category name (e.g. PHONE_NUMBER, CUSTOMER_ID) and
  # point it at your own file; that becomes a literal pool and overrides the
  # generator for that category. See README "Which categories are list-backed
  # vs generated".
  lists_dir: ${LONO_CONFIG_DIR:-/config}/lists
  lists:
    first_names: first_names.txt
    last_names: last_names.txt
    cities: cities.txt
    companies: companies.txt
    domain_words: domain_words.txt
    street_names: street_names.txt
    street_suffixes: street_suffixes.txt
    # PHONE_NUMBER: phone_numbers.txt
    # CUSTOMER_ID: customer_ids.txt
  pools: {} # inline overrides, e.g. { first_names: [Alice, Bob] }

# Runtime allow-through controls, managed from the console (/ui) or the
# /audit/overrides API. Expired/revoked overrides are ignored.
overrides:
  enabled: true
  cache_seconds: 3
  default_max_minutes: 60
  allow_permanent: true

audit:
  enabled: true
  sqlite_path: ${LONO_DATA_DIR:-/data}/audit.db
  capture_original: true
  max_payload_bytes: 20000000
  retention_days: 0 # 0 = keep forever
  media:
    enabled: true
    backend: ${LONO_MEDIA_BACKEND:-local} # local | minio
    local_path: ${LONO_DATA_DIR:-/data}/media
    endpoint: ${MINIO_ENDPOINT:-minio:9000}
    access_key: ${MINIO_ACCESS_KEY:-}
    secret_key: ${MINIO_SECRET_KEY:-}
    secure: false
    bucket: ${MINIO_BUCKET:-lono-media}
    max_store_bytes: 50000000
    fetch_remote_images: false # do not fetch remote image URLs by default
  langfuse:
    enabled: true # effective only when public/secret keys are present
    host: ${LANGFUSE_HOST:-http://langfuse-web:3000}
    public_key: ${LANGFUSE_PUBLIC_KEY:-}
    secret_key: ${LANGFUSE_SECRET_KEY:-}
    max_chars: 100000

upstream:
  base_url: ${LONO_UPSTREAM_URL:-http://litellm:4000}
  timeout_s: 900
  connect_timeout_s: 10
  max_body_bytes: 50000000
  forward_headers:
    - authorization
    - x-api-key
    - anthropic-version
    - anthropic-beta
    - openai-organization
    - openai-project
    - content-type
    - accept

auth:
  admin_key: ${LONO_ADMIN_KEY:-}
  allow_unauthenticated_audit: false
  client_keys: []
  require_client_key: false