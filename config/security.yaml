# Lono security configuration.
# Values support environment expansion: ${VAR} or ${VAR:-default}.

mode: sanitize # observe | sanitize | enforce
fail_closed: false
allow_client_mode_override: false # allow X-Lono-Mode header to override mode per request
inspect_tools: false # scan tool descriptions (flag-only)
# Console-managed runtime overrides (detector toggles, substitutions, upstreams,
# MCP servers). Written by the console API and re-applied on startup.
runtime_config_path: ${LONO_DATA_DIR:-data}/runtime_config.json

detectors:
  secrets:
    enabled: true
    action: mask # mask | flag | block
    entropy: true
    entropy_threshold: 4.2
    entropy_min_length: 24
    entropy_action: flag # high-entropy strings are noisy; flag by default
    # SSH / encryption key material, recognized by shape and replaced with a
    # format-preserving fake. On by default; each family can be disabled.
    key_material:
      enabled: true
      action: mask # mask | flag | block
      private_keys: true # PEM, OpenSSH, PKCS#8-encrypted private keys
      public_keys: true # ssh-rsa / ssh-ed25519 / ecdsa-sha2-* public keys
      gpg: true # OpenPGP (GPG) public/private key blocks
      putty: true # PuTTY .ppk private key files
    # Console-managed custom detection rules (exact keys, env var names, or
    # regex). Managed from the Substitutions page under "Secret detection
    # rules". Each rule may override the action (mask | flag | block).
    # custom:
    #   - kind: RUNPOD_API_KEY
    #     match: env            # regex | word | substring | env
    #     env_names: [RUNPOD_API_KEY]
    #     action: mask
    #   - kind: ACME_KEY
    #     match: regex
    #     pattern: "\\bacme_[A-Za-z0-9]{16}\\b"
    #     action: mask
    custom: []

  pii:
    enabled: false # coding workload: PII false positives mangle code identifiers
    engine: auto # auto | presidio | regex
    presidio_url: ${PRESIDIO_URL:-http://presidio-analyzer:3000}
    language: en
    score_threshold: 0.4
    timeout_s: 10
    default_action: pseudonymize # used for entity types not listed below
    custom_patterns_file: ${LONO_CONFIG_DIR:-/config}/presidio/patterns.yaml
    filter_technical: true # drop Presidio name entities that look like code identifiers/paths
    actions:
      EMAIL_ADDRESS: pseudonymize
      PERSON: pseudonymize
      PHONE_NUMBER: pseudonymize
      LOCATION: pseudonymize
      ORGANIZATION: pseudonymize
      IP_ADDRESS: pseudonymize
      STREET_ADDRESS: pseudonymize
      POSTAL_CODE: pseudonymize
      CREDIT_CARD: mask
      US_SSN: mask
      US_PASSPORT: mask
      US_DRIVER_LICENSE: mask
      MEDICAL_LICENSE: mask
      IBAN_CODE: mask
      BTC_ADDRESS: mask
      ETH_ADDRESS: mask
      MAC_ADDRESS: flag
      DATE_TIME: flag
      URL: flag

  injection:
    enabled: false
    action: flag # flag | block (block applies in enforce mode only)
    flag_threshold: 0.45
    block_threshold: 0.8

  urls:
    enabled: false
    action: flag # flag | block (block applies in enforce mode only)
    allow_schemes: [http, https]
    block_threshold: 0.9

# Watchlist of project codenames, internal terms, and other sensitive strings.
# Terms come from this inline list and/or watchlist.file.
watchlist:
  enabled: false
  file: ${LONO_CONFIG_DIR:-/config}/watchlist.yaml
  terms: []
  # - term: "Project Bluebird"
  #   category: PROJECT_CODENAME
  #   replacement_type: PROJECT_CODENAME   # which generator to use for the fake value
  #   action: pseudonymize                 # pseudonymize | mask | flag | block
  #   match: word                          # word | substring | regex
  #   case_sensitive: false
  # - term: "acme-internal"
  #   category: INTERNAL_NAME
  #   action: mask

# Literal keyword swaps: replace exact strings with chosen values (still
# reversible — provider output that echoes the replacement is rehydrated).
# Managed from the console's Substitutions page.
substitutions:
  enabled: true
  terms: []
  # - pattern: "youruser"
  #   replacement: "alex"
  #   match: word            # word | substring | regex
  # - pattern: 'C:\\Users\\youruser'
  #   replacement: '/home/user'
  #   match: substring
  # - pattern: '\bgh/([a-z0-9-]+)\b'
  #   replacement: 'gh/redacted-user'
  #   match: regex

# Tool / command / MCP activity extraction for the console's Tools page.
tools:
  enabled: true
  extract_commands: true
  command_tools: [bash, shell, sh, run_command, execute_command, terminal, exec, run_shell_command, command]
  max_events_per_request: 200
  preview_chars: 2000

# MCP servers proxied (and audited) under /v1/mcp/{name}. Managed from the
# console's Tools page.
mcp:
  enabled: true
  timeout_s: 120
  servers: []
  # - name: filesystem
  #   url: http://mcp-filesystem:3000
  #   headers: {}

output_scan:
  enabled: true
  secrets: true
  injection: false
  pii: false
  watchlist: false
  action: flag # flag | mask (secrets only when mask)

pseudonymization:
  secret: ${LONO_PSEUDONYM_SECRET:-}
  stable_across_sessions: false # true = same entity maps to the same pseudonym everywhere
  # Per-category replacement lists. Relative paths resolve against lists_dir;
  # use "builtin" to force the shipped Python defaults. Inline pools win.
  #
  # The entries below are the categories that are list-backed by default.
  # You may add ANY other category name (e.g. PHONE_NUMBER, CUSTOMER_ID) and
  # point it at your own file; that becomes a literal pool and overrides the
  # generator for that category. See README "Which categories are list-backed
  # vs generated".
  lists_dir: ${LONO_CONFIG_DIR:-/config}/lists
  lists:
    first_names: first_names.txt
    last_names: last_names.txt
    cities: cities.txt
    companies: companies.txt
    domain_words: domain_words.txt
    street_names: street_names.txt
    street_suffixes: street_suffixes.txt
    # PHONE_NUMBER: phone_numbers.txt
    # CUSTOMER_ID: customer_ids.txt
  pools: {} # inline overrides, e.g. { first_names: [Alice, Bob] }

# Runtime allow-through controls, managed from the console (/ui) or the
# /audit/overrides API. Expired/revoked overrides are ignored.
overrides:
  enabled: true
  cache_seconds: 3
  default_max_minutes: 60
  allow_permanent: true

audit:
  enabled: true
  sqlite_path: ${LONO_DATA_DIR:-/data}/audit.db
  capture_original: true
  max_payload_bytes: 20000000
  retention_days: 0 # 0 = keep forever
  media:
    enabled: true
    backend: ${LONO_MEDIA_BACKEND:-local} # local | minio
    local_path: ${LONO_DATA_DIR:-/data}/media
    endpoint: ${MINIO_ENDPOINT:-minio:9000}
    access_key: ${MINIO_ACCESS_KEY:-}
    secret_key: ${MINIO_SECRET_KEY:-}
    secure: false
    bucket: ${MINIO_BUCKET:-lono-media}
    max_store_bytes: 50000000
    fetch_remote_images: false # do not fetch remote image URLs by default
  langfuse:
    enabled: true # effective only when public/secret keys are present
    host: ${LANGFUSE_HOST:-http://langfuse-web:3000}
    public_key: ${LANGFUSE_PUBLIC_KEY:-}
    secret_key: ${LANGFUSE_SECRET_KEY:-}
    max_chars: 100000

# Default provider proxy. Additional proxies run concurrently; a request is
# routed by the x-lono-upstream header, then by model glob, then path prefix.
upstream:
  name: default
  base_url: ${LONO_UPSTREAM_URL:-http://litellm:4000}
  enabled: true
  timeout_s: 900
  connect_timeout_s: 10
  max_body_bytes: 50000000
  models: []
  path_prefixes: []
  forward_headers:
    - authorization
    - x-api-key
    - anthropic-version
    - anthropic-beta
    - openai-organization
    - openai-project
    - content-type
    - accept

upstreams: []
# - name: anthropic-direct
#   base_url: https://api.anthropic.com
#   models: ["claude-*"]
#   forward_headers: [x-api-key, anthropic-version, content-type, accept]
# - name: openai-direct
#   base_url: https://api.openai.com/v1
#   models: ["gpt-*", "o1-*", "o3-*"]

# Friendly names for connecting clients, keyed by the anonymous fingerprint
# shown on the console's Clients page. Normally managed from the console
# (Clients -> open a client -> Save name) and persisted to runtime_config.json;
# set them here to seed an install.
clients:
  labels: {}
  # labels:
  #   "a1b2c3d4e5f60718": "laptop"
  #   "0011223344556677": "ci-runner"

auth:
  admin_key: ${LONO_ADMIN_KEY:-}
  allow_unauthenticated_audit: false
  client_keys: []
  require_client_key: false