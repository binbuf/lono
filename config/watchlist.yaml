# Lono watchlist: project codenames, internal terms, other sensitive strings.
#
# Each entry:
#   term:              exact text, substring, or regex depending on `match`
#   category:          finding kind shown in the console
#   replacement_type:  optional generator to use for the fake value
#                      (e.g. PERSON, ORGANIZATION, PROJECT_CODENAME)
#   action:            pseudonymize | mask | flag | block
#                      block applies only in `enforce` mode
#   match:             word | substring | regex
#   case_sensitive:    default false
#
# Terms can also be declared inline under `watchlist.terms` in security.yaml.

